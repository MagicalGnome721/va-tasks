<style>
/* ========================================================================
   VA Tasks · v2.1 visual system
   Restrained: cool neutral grounds, one cobalt accent for actions & selection.
   Status speaks with a dot + words, never with filled slabs or side stripes.
   ======================================================================== */
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Be Vietnam Pro", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  --canvas: #f8f2ec;          /* app ground + sidebar */
  --surface: #fffcf9;         /* content */
  --surface-2: #faf4ee;       /* hover, quiet fills */
  --surface-3: #f1e6dc;       /* tracks, chips */
  --ink: #2b1c16;
  --ink-2: #4f3a30;
  --muted: #715b4f;           /* ≥4.5:1 on surface */
  --faint: #a08a7c;           /* decoration only */
  --line: #ecdfd3;
  --line-strong: #dccabb;
  --brand: #b4432a;           /* cobalt — actions, selection, focus */
  --brand-hover: #963720;
  --brand-ink: #ffffff;
  --brand-soft: #fbe9e0;
  --brand-text: #9a3920;
  --focus: #b4432a;
  --overlay: rgba(43, 22, 14, .38);
  --shadow-1: 0 1px 2px rgba(18, 21, 28, .05);
  --shadow-2: 0 6px 20px rgba(18, 21, 28, .10), 0 1px 3px rgba(18, 21, 28, .06);
  --shadow-3: 0 18px 48px rgba(18, 21, 28, .20), 0 2px 6px rgba(18, 21, 28, .06);
  --warn-bg: #fdf6e3; --warn-fg: #6b4a00; --warn-line: #ecd9a2;
  --err-bg: #fdecec; --err-fg: #a3191f; --err-line: #f2c4c6;
  --ok-bg: #e3f4f1; --ok-fg: #1d6b62;

  /* status: text / quiet bg / dot */
  --st-new-fg: #4f3a30;   --st-new-bg: #f1e6dc;   --st-new: #a08a7c;
  --st-assigned-fg: #3f37b8; --st-assigned-bg: #eef0fd; --st-assigned: #6366f1;
  --st-in_progress-fg: #1f4fb0; --st-in_progress-bg: #eaf0fc; --st-in_progress: #3a6be0;
  --st-review-fg: #85410a; --st-review-bg: #fdf3e4; --st-review: #d98a1c;
  --st-changes_requested-fg: #9c3412; --st-changes_requested-bg: #fdeee6; --st-changes_requested: #e5622a;
  --st-done-fg: #1d6b62; --st-done-bg: #e3f4f1; --st-done: #2a9a8c;
  --st-on_hold-fg: #394150; --st-on_hold-bg: #eceef2; --st-on_hold: #6b7383;
  --st-cancelled-fg: #5c6474; --st-cancelled-bg: #f1f2f4; --st-cancelled: #a9afba;
  --st-unknown-fg: #4b5563; --st-unknown-bg: #eff0f2; --st-unknown: #a9afba;

  /* deadline */
  --dl-overdue-fg: #b4181f; --dl-overdue-bg: #fdecec; --dl-overdue: #dc2f35;
  --dl-dueSoon-fg: #94480a; --dl-dueSoon-bg: #fdf1e2; --dl-dueSoon: #e48a1a;
  --dl-ok-fg: #4f3a30; --dl-ok-bg: #f4ece4; --dl-ok: #8a93a3;
  --dl-none-fg: #715b4f; --dl-none-bg: #f4ece4; --dl-none: #b5bbc6;
  --dl-done-fg: #1d6b62; --dl-done-bg: #e3f4f1; --dl-done: #2a9a8c;
  --dl-cancelled-fg: #5c6474; --dl-cancelled-bg: #f1f2f4; --dl-cancelled: #a9afba;

  --pr-1: #dc2f35; --pr-2: #e48a1a; --pr-3: #3a6be0; --pr-4: #a0a7b4;
  --pr-up-bg: #fdf1e2; --pr-up-fg: #94480a;
  --ok-btn: #23806f; --ok-btn-h: #1d6b62;

  --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
  --topbar-h: 56px;
  --nav-w: 224px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #271c17; --surface: #31241e; --surface-2: #3a2b24; --surface-3: #46352c;
    --ink: #fcf4ef; --ink-2: #efe0d6; --muted: #d2bdb0; --faint: #a38d7f;
    --line: #4c3a31; --line-strong: #634c40;
    --brand: #ff9470; --brand-hover: #ffab8f; --brand-ink: #2a120a; --brand-soft: #4a2b21; --brand-text: #ffb59c; --focus: #ffa182;
    --overlay: rgba(0, 0, 0, .55);
    --shadow-1: 0 1px 2px rgba(0,0,0,.25); --shadow-2: 0 8px 24px rgba(0,0,0,.35); --shadow-3: 0 20px 56px rgba(0,0,0,.6);
    --warn-bg: #2f2814; --warn-fg: #f1d68c; --warn-line: #5a4a1a;
    --err-bg: #341719; --err-fg: #ffb3b5; --err-line: #5c262a; --ok-bg: #123430; --ok-fg: #8fe0d3;
    --st-new-fg: #efe0d6; --st-new-bg: #46352c; --st-new: #7f8898;
    --st-assigned-fg: #b8b9ff; --st-assigned-bg: #24264a;
    --st-in_progress-fg: #a3bbff; --st-in_progress-bg: #1a2442; --st-in_progress: #6f93ff;
    --st-review-fg: #f5cd86; --st-review-bg: #322611; --st-review: #e3a03d;
    --st-changes_requested-fg: #ffb894; --st-changes_requested-bg: #3a2016; --st-changes_requested: #f07a45;
    --st-done-fg: #8fe0d3; --st-done-bg: #123430; --st-done: #3cbfae;
    --st-on_hold-fg: #c3c9d3; --st-on_hold-bg: #242932;
    --st-cancelled-fg: #d2bdb0; --st-cancelled-bg: #1f232a;
    --st-unknown-fg: #b9bfc9; --st-unknown-bg: #22262d;
    --dl-overdue-fg: #ffb3b5; --dl-overdue-bg: #3a181b; --dl-overdue: #ff5c63;
    --dl-dueSoon-fg: #ffc98a; --dl-dueSoon-bg: #35260f; --dl-dueSoon: #f0a040;
    --dl-ok-fg: #efe0d6; --dl-ok-bg: #3a2b24;
    --dl-none-fg: #d2bdb0; --dl-none-bg: #3a2b24;
    --dl-done-fg: #8fe0d3; --dl-done-bg: #123430;
    --dl-cancelled-fg: #d2bdb0; --dl-cancelled-bg: #1f232a;
    --pr-up-bg: #35260f; --pr-up-fg: #ffc98a;
    --ok-btn: #2f9d5e; --ok-btn-h: #278a52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #271c17; --surface: #31241e; --surface-2: #3a2b24; --surface-3: #46352c;
  --ink: #fcf4ef; --ink-2: #efe0d6; --muted: #d2bdb0; --faint: #a38d7f;
  --line: #4c3a31; --line-strong: #634c40;
  --brand: #ff9470; --brand-hover: #ffab8f; --brand-ink: #2a120a; --brand-soft: #4a2b21; --brand-text: #ffb59c; --focus: #ffa182;
  --overlay: rgba(0, 0, 0, .55);
  --shadow-1: 0 1px 2px rgba(0,0,0,.25); --shadow-2: 0 8px 24px rgba(0,0,0,.35); --shadow-3: 0 20px 56px rgba(0,0,0,.6);
  --warn-bg: #2f2814; --warn-fg: #f1d68c; --warn-line: #5a4a1a;
  --err-bg: #341719; --err-fg: #ffb3b5; --err-line: #5c262a; --ok-bg: #123430; --ok-fg: #8fe0d3;
  --st-new-fg: #efe0d6; --st-new-bg: #46352c; --st-new: #7f8898;
  --st-assigned-fg: #b8b9ff; --st-assigned-bg: #24264a;
  --st-in_progress-fg: #a3bbff; --st-in_progress-bg: #1a2442; --st-in_progress: #6f93ff;
  --st-review-fg: #f5cd86; --st-review-bg: #322611; --st-review: #e3a03d;
  --st-changes_requested-fg: #ffb894; --st-changes_requested-bg: #3a2016; --st-changes_requested: #f07a45;
  --st-done-fg: #8fe0d3; --st-done-bg: #123430; --st-done: #3cbfae;
  --st-on_hold-fg: #c3c9d3; --st-on_hold-bg: #242932;
  --st-cancelled-fg: #d2bdb0; --st-cancelled-bg: #1f232a;
  --st-unknown-fg: #b9bfc9; --st-unknown-bg: #22262d;
  --dl-overdue-fg: #ffb3b5; --dl-overdue-bg: #3a181b; --dl-overdue: #ff5c63;
  --dl-dueSoon-fg: #ffc98a; --dl-dueSoon-bg: #35260f; --dl-dueSoon: #f0a040;
  --dl-ok-fg: #efe0d6; --dl-ok-bg: #3a2b24;
  --dl-none-fg: #d2bdb0; --dl-none-bg: #3a2b24;
  --dl-done-fg: #8fe0d3; --dl-done-bg: #123430;
  --dl-cancelled-fg: #d2bdb0; --dl-cancelled-bg: #1f232a;
  --pr-up-bg: #35260f; --pr-up-fg: #ffc98a;
  --ok-btn: #2f9d5e; --ok-btn-h: #278a52;
  color-scheme: dark;
}

/* ========================================================================
   Base
   ======================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--canvas); color: var(--ink);
  font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden;
}
::selection { background: var(--brand-soft); color: var(--ink); }
input, textarea { caret-color: var(--brand); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
::placeholder { color: var(--muted); opacity: .85; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
a { color: inherit; text-underline-offset: 3px; }
a:not([class]) { color: var(--brand-text); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--surface); padding: 8px 12px; border-radius: var(--r-sm); box-shadow: var(--shadow-2); }
.skip-link:focus { top: 8px; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ========================================================================
   App shell
   ======================================================================== */
.app {
  display: grid; min-height: 100vh;
  grid-template-columns: var(--nav-w) minmax(0, 1fr);
  grid-template-rows: var(--topbar-h) auto minmax(0, 1fr);
  grid-template-areas: "top top" "banner banner" "nav main";
}
.topbar {
  grid-area: top; position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px; padding: 0 16px 0 18px;
  background: color-mix(in srgb, var(--canvas) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; min-width: calc(var(--nav-w) - 34px); text-decoration: none; }
.brand-mark { width: 30px; height: 30px; flex: none; object-fit: contain; }
.brand-name { font-weight: 650; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
.demo-badge {
  font-size: 11px; font-weight: 650; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px;
  background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); cursor: help;
}
.search { position: relative; flex: 1 1 auto; max-width: 480px; }
.search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; width: 16px; height: 16px; }
.search input {
  width: 100%; height: 36px; padding: 0 12px 0 34px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface); transition: border-color .15s, box-shadow .15s;
}
.search input:hover { border-color: var(--line-strong); }
.search input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
.topbar-spacer { flex: 1 1 0; }
.topbar-right { display: flex; align-items: center; gap: 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px;
  border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 550; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  box-shadow: var(--shadow-1);
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--faint); }
.btn:active:not(:disabled) { transform: translateY(.5px); }
.btn-primary, .btn-brand { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn-primary:hover:not(:disabled), .btn-brand:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn-danger { background: #c4262d; color: #fff; border-color: #c4262d; }
.btn-danger:hover:not(:disabled) { background: #a51f25; border-color: #a51f25; }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); border-color: transparent; color: var(--ink); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: var(--r-sm); }
.btn-danger-text { color: #c4262d; }
:root[data-theme="dark"] .btn-danger-text { color: #ff8a8f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-danger-text { color: #ff8a8f; } }
.btn-ok { background: var(--ok-btn); border-color: var(--ok-btn); color: #fff; }
.btn-ok:hover:not(:disabled) { background: var(--ok-btn-h); border-color: var(--ok-btn-h); }
.btn .ico { width: 16px; height: 16px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-md);
  border: 1px solid transparent; background: transparent; color: var(--muted); transition: background .15s, color .15s;
}
.icon-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--ink); }
.icon-btn-sm { width: 28px; height: 28px; border-radius: var(--r-sm); }
.icon-btn-sm .ico { width: 16px; height: 16px; }

.sync-chip {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 999px;
  border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap;
}
.sync-chip:hover { background: var(--surface-3); }
.sync-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.sync-chip[data-state="demo"] { color: var(--warn-fg); }
.sync-chip[data-state="idle"] { color: var(--ok-fg); }
.sync-chip[data-state="error"] { color: var(--err-fg); background: var(--err-bg); }
.sync-chip[data-state="offline"] { color: var(--warn-fg); background: var(--warn-bg); }
.sync-chip[data-state="syncing"] .dot { background: transparent; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; width: 11px; height: 11px; }
.sync-chip .sync-text { color: var(--ink-2); }
@keyframes spin { to { transform: rotate(360deg); } }

.user-chip {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 3px; border-radius: 999px; white-space: nowrap; flex: none;
  border: 1px solid transparent; background: transparent; text-align: left;
}
.user-chip:hover { background: var(--surface-3); }
.user-chip:empty { display: none; }
.tu-text { display: flex; flex-direction: column; line-height: 1.15; }
.tu-name { font-weight: 600; font-size: 13px; }
.user-chip .role-tag { font-size: 11px; padding: 0; height: auto; background: none; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.logout-btn { width: auto; padding: 0 10px; gap: 6px; display: inline-flex; align-items: center; font-weight: 500; font-size: 13px; color: var(--ink-2); }
.role-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--brand-soft); color: var(--brand-text); }
.role-tag[data-role="requester"] { background: var(--surface-3); color: var(--ink-2); }
.avatar {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; flex: none;
  font-size: 11px; font-weight: 650; letter-spacing: .02em; color: #fff; background: var(--av, #64748b);
}
.avatar-sm { width: 22px; height: 22px; font-size: 9.5px; }
.avatar-lg { width: 40px; height: 40px; font-size: 14px; }
.avatar-empty { background: transparent; border: 1.5px dashed var(--line-strong); color: var(--faint); }

.offline-banner {
  grid-area: banner; display: flex; align-items: center; gap: 10px; padding: 9px 20px;
  background: var(--warn-bg); color: var(--warn-fg); border-bottom: 1px solid var(--warn-line); font-weight: 500;
}

/* nav */
.sidenav {
  grid-area: nav; position: sticky; top: var(--topbar-h); align-self: start; height: calc(100vh - var(--topbar-h));
  padding: 14px 10px; background: var(--canvas); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 1px; z-index: 20;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-md);
  text-decoration: none; color: var(--ink-2); font-weight: 500; position: relative; transition: background .15s, color .15s;
}
.nav-item .ico { color: var(--muted); }
.nav-item:hover { background: var(--surface-3); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.nav-item[aria-current="page"] .ico { color: var(--brand); }
.nav-foot { margin-top: auto; padding: 12px 10px; color: var(--muted); font-size: 12px; line-height: 1.7; }
.nav-foot kbd { font-size: 11px; }

main { grid-area: main; min-width: 0; padding: 28px 32px 56px; }
main:focus, main:focus-visible { outline: none; }
#view { max-width: 1240px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.view-title { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; }
.view-sub { color: var(--muted); margin-top: 4px; max-width: 72ch; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ========================================================================
   Status / deadline / priority / size — dot + words
   ======================================================================== */
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 7px; border-radius: 999px;
  font-size: 12.5px; font-weight: 550; white-space: nowrap; border: 1px solid var(--line);
  color: var(--ink-2); background: var(--surface);
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--st-dot); flex: none; }
button.pill { cursor: pointer; }
button.pill:hover { border-color: var(--line-strong); background: var(--surface-2); }
.pill[data-status="review"], .pill[data-status="changes_requested"] { color: var(--st-fg); background: var(--st-bg); border-color: transparent; }
.pill[data-status="cancelled"] .pill-text { text-decoration: line-through; }
.pill-sub { font-weight: 500; font-size: 10.5px; opacity: .8; margin-left: 2px; padding-left: 6px; border-left: 1px solid currentColor; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: var(--r-sm);
  font-size: 12px; white-space: nowrap; color: var(--dl-fg); background: var(--dl-bg);
}
.badge .label { font-weight: 600; }
.badge .deadline-detail:empty { display: none; }
.badge[data-state="ok"], .badge[data-state="none"] { background: transparent; padding: 0; color: var(--muted); }
.badge[data-state="ok"] .label, .badge[data-state="none"] .label { font-weight: 500; }
.prio { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.prio-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pr, var(--pr-4)); flex: none; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.progress { display: inline-flex; align-items: center; gap: 8px; min-width: 76px; }
.progress-track { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; min-width: 40px; }
.progress-fill { height: 100%; background: var(--st-dot, var(--st-in_progress)); border-radius: 4px; }
.progress-val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
.size-badge {
  display: inline-grid; place-items: center; min-width: 24px; height: 20px; padding: 0 6px; border-radius: 5px; font-size: 11px; font-weight: 650;
  font-family: var(--mono); letter-spacing: 0; white-space: nowrap; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
}
.size-badge[data-size="XL"] { border-color: var(--dl-overdue); color: var(--dl-overdue-fg); }
.size-badge.is-empty { font-family: var(--font); font-weight: 500; border-style: dashed; color: var(--muted); }
.size-btn { border: 0; background: none; padding: 3px; margin: -3px; border-radius: 7px; display: inline-flex; }
.size-btn:hover:not(:disabled) .size-badge { border-color: var(--brand); color: var(--brand-text); }
.size-badge.is-lg { min-width: 34px; height: 28px; font-size: 14px; border-radius: 7px; }
.mini-tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; margin-left: 6px; }
.mini-tag.is-up { background: var(--pr-up-bg); color: var(--pr-up-fg); }
.mini-tag.is-hot { background: var(--dl-overdue-bg); color: var(--dl-overdue-fg); }
.flag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: var(--r-sm); font-size: 12px; font-weight: 550; white-space: nowrap; max-width: 100%; color: var(--ink-2); background: var(--surface-3); }
.flag span { overflow: hidden; text-overflow: ellipsis; }
.flag .ico { width: 13px; height: 13px; }
.flag.is-hold { background: transparent; border: 1px dashed var(--line-strong); }
.flag.is-discuss { background: var(--dl-overdue-bg); color: var(--dl-overdue-fg); }
.flag.is-parent { background: var(--brand-soft); color: var(--brand-text); }
.flag.is-child { color: var(--muted); font-weight: 500; }
.count-pill { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-size: 11.5px; font-weight: 650; font-variant-numeric: tabular-nums; vertical-align: 1px; }
.nav-badge { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.dot-sep::before { content: "·"; margin: 0 6px; color: var(--faint); }
.linklike { background: none; border: 0; padding: 4px 2px; color: var(--ink-2); font-weight: 550; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; display: inline-flex; align-items: center; gap: 6px; }
.linklike:hover:not(:disabled) { color: var(--ink); text-decoration-color: currentColor; }
.linklike:disabled { text-decoration: none; color: var(--muted); }
.id-link { font-family: var(--mono); font-size: 12px; background: none; border: 0; padding: 0; color: var(--brand-text); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--brand-text) 35%, transparent); text-underline-offset: 3px; }
.id-link:hover { text-decoration-color: currentColor; }

/* status token mapping */
[data-status="new"] { --st-fg: var(--st-new-fg); --st-bg: var(--st-new-bg); --st-dot: var(--st-new); }
[data-status="assigned"] { --st-fg: var(--st-assigned-fg); --st-bg: var(--st-assigned-bg); --st-dot: var(--st-assigned); }
[data-status="in_progress"] { --st-fg: var(--st-in_progress-fg); --st-bg: var(--st-in_progress-bg); --st-dot: var(--st-in_progress); }
[data-status="review"] { --st-fg: var(--st-review-fg); --st-bg: var(--st-review-bg); --st-dot: var(--st-review); }
[data-status="changes_requested"] { --st-fg: var(--st-changes_requested-fg); --st-bg: var(--st-changes_requested-bg); --st-dot: var(--st-changes_requested); }
[data-status="done"] { --st-fg: var(--st-done-fg); --st-bg: var(--st-done-bg); --st-dot: var(--st-done); }
[data-status="on_hold"] { --st-fg: var(--st-on_hold-fg); --st-bg: var(--st-on_hold-bg); --st-dot: var(--st-on_hold); }
[data-status="cancelled"] { --st-fg: var(--st-cancelled-fg); --st-bg: var(--st-cancelled-bg); --st-dot: var(--st-cancelled); }
[data-status="unknown"] { --st-fg: var(--st-unknown-fg); --st-bg: var(--st-unknown-bg); --st-dot: var(--st-unknown); }
[data-state="overdue"] { --dl-fg: var(--dl-overdue-fg); --dl-bg: var(--dl-overdue-bg); --dl-dot: var(--dl-overdue); }
[data-state="dueSoon"] { --dl-fg: var(--dl-dueSoon-fg); --dl-bg: var(--dl-dueSoon-bg); --dl-dot: var(--dl-dueSoon); }
[data-state="ok"] { --dl-fg: var(--dl-ok-fg); --dl-bg: var(--dl-ok-bg); --dl-dot: var(--dl-ok); }
[data-state="none"] { --dl-fg: var(--dl-none-fg); --dl-bg: var(--dl-none-bg); --dl-dot: var(--dl-none); }
[data-state="done"] { --dl-fg: var(--dl-done-fg); --dl-bg: var(--dl-done-bg); --dl-dot: var(--dl-done); }
[data-state="cancelled"] { --dl-fg: var(--dl-cancelled-fg); --dl-bg: var(--dl-cancelled-bg); --dl-dot: var(--dl-cancelled); }

/* ========================================================================
   Sections & row lists (queue, my work)
   ======================================================================== */
.qsection { margin-bottom: 32px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 10px; flex-wrap: wrap; }
.sec-title { font-size: 14px; font-weight: 650; display: flex; align-items: center; }
.sec-meta { color: var(--muted); font-size: 12.5px; }
.sec-empty { padding: 18px 20px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; }
.qrow, .wrow {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; gap: 16px; align-items: center;
  padding: 12px 14px 12px 12px; border-top: 1px solid var(--line); cursor: pointer; position: relative; transition: background .12s;
}
.wrow { grid-template-columns: minmax(0, 1fr) auto auto; padding-left: 16px; }
.qrow:first-child, .wrow:first-child { border-top: 0; }
.qrow:hover, .wrow:hover { background: var(--surface-2); }
.qrow:focus-visible, .wrow:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 0; }
.qrow.is-held { background: var(--surface-2); }
.qrow.is-held .qname { color: var(--muted); }
.qpos { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-variant-numeric: tabular-nums; font-weight: 650; font-size: 13px; color: var(--ink-2); background: var(--surface-3); }
.qrow:first-child .qpos { background: var(--brand); color: var(--brand-ink); }
.qmain, .wmain { min-width: 0; }
.qtitle { display: flex; align-items: center; gap: 8px; min-width: 0; }
.qname { font-weight: 600; overflow-wrap: anywhere; line-height: 1.35; }
.qsub { display: flex; align-items: center; flex-wrap: wrap; row-gap: 2px; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
.qsub .mono { color: var(--muted); }
.qsub .dot-sep.is-hot { color: var(--dl-overdue-fg); font-weight: 600; }
.qnote { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
.qnote .ico { width: 14px; height: 14px; color: var(--muted); }
.qreasons { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 12px; color: var(--brand-text); }
.qreasons .ico { width: 13px; height: 13px; }
.qflags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.qsig { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 12.5px; color: var(--ink-2); }
.sig-prio { display: inline-flex; align-items: center; gap: 6px; min-width: 86px; }
.sig-up { margin-left: 3px; color: var(--pr-up-fg); font-weight: 700; }
.sig-dl { min-width: 82px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.sig-dl[data-state="overdue"] { color: var(--dl-overdue-fg); font-weight: 650; }
.sig-dl[data-state="dueSoon"] { color: var(--dl-dueSoon-fg); font-weight: 650; }
.qactions { display: flex; gap: 6px; align-items: center; justify-content: flex-end; min-width: 120px; }
.wrow .qtitle .pill { flex: none; }
.wrow .qactions { min-width: 0; }
.is-saving { opacity: .7; }
.saving-spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--faint); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-left: 6px; }
.dash { color: var(--muted); }

/* ========================================================================
   Overview
   ======================================================================== */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; margin-bottom: 24px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-1); }
.stat {
  text-align: left; padding: 14px 16px; border: 0; background: var(--surface); display: flex; flex-direction: column; gap: 2px; position: relative; transition: background .12s;
}
.stat:hover { background: var(--surface-2); }
.stat-label { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.stat-value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-hint { font-size: 12px; color: var(--muted); }
.stat[data-key="overdue"].is-hot .stat-value, .stat[data-key="overdue"].is-hot .stat-label { color: var(--dl-overdue-fg); }
.stat[data-key="mine"] .stat-value { color: var(--brand-text); }
.ov-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.ov-col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.panel { overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 8px; }
.panel-title { font-size: 14px; font-weight: 650; }
.panel-link { color: var(--muted); font-size: 13px; text-decoration: none; font-weight: 500; background: none; border: 0; padding: 4px 6px; border-radius: 6px; }
.panel-link:hover { color: var(--ink); background: var(--surface-2); }
.panel-body { padding: 0 6px 8px; }
.panel-empty { padding: 16px 16px 20px; color: var(--muted); }
.panel-meta { color: var(--muted); font-size: 12.5px; text-align: right; }
.task-line {
  display: grid; grid-template-columns: 62px minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  padding: 8px 10px; border-radius: var(--r-md); cursor: pointer; width: 100%; text-align: left; background: none; border: 0;
}
.task-line:hover { background: var(--surface-2); }
.task-line .mono { color: var(--muted); }
.task-line .tl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.task-line .tl-actions { display: flex; gap: 6px; }
.task-line.with-actions { grid-template-columns: 62px minmax(0, 1fr) auto; }
.status-row {
  display: grid; grid-template-columns: 120px minmax(0, 1fr) 28px; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--r-md); width: 100%; background: none; border: 0; text-align: left;
}
.status-row:hover { background: var(--surface-2); }
.status-row .bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.status-row .bar > span { display: block; height: 100%; background: var(--st-dot); border-radius: 3px; }
.status-row .cnt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.workload-row {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) 30px; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--r-md); width: 100%; background: none; border: 0; text-align: left;
}
.workload-row:hover { background: var(--surface-2); }
.workload-name { font-weight: 500; font-size: 13.5px; }
.wl-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-3); margin-top: 4px; }
.wl-bar .wl-ok { background: var(--st-in_progress); }
.wl-bar .wl-over { background: var(--dl-overdue); }
.workload-row .cnt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.wl-legend { display: flex; gap: 14px; padding: 4px 16px 12px; font-size: 12px; color: var(--muted); }
.wl-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.wl-sizes { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 6px; }

/* ========================================================================
   Toolbar / filters
   ======================================================================== */
.toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.toolbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qf-bar { display: flex; gap: 4px; flex-wrap: wrap; padding: 3px; background: var(--surface-3); border-radius: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 7px;
  border: 1px solid transparent; background: transparent; color: var(--ink-2); font-weight: 500; font-size: 13px; white-space: nowrap;
}
.chip:hover { color: var(--ink); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.chip[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-1); }
.chip .chip-count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.ai-suggest .chip { border-color: var(--line); background: var(--surface); height: auto; min-height: 32px; padding: 6px 12px; white-space: normal; text-align: left; border-radius: 999px; }
.ai-suggest .chip:hover { border-color: var(--brand); color: var(--brand-text); }
.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.list-count { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; white-space: nowrap; }
.switch input {
  appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 999px; margin: 0;
  background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s; flex: none;
}
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--brand); }
.switch input:checked::after { transform: translateX(14px); }
.select-inline { height: 30px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); padding: 0 8px; font-size: 13px; }
.filters-panel {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px;
  padding: 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1);
}
.filter-group label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
.filter-group select { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); padding: 4px; font-size: 13px; height: 128px; }
.filter-group select option { padding: 4px 8px; border-radius: 4px; }
.filter-group select option:checked { background: var(--brand) linear-gradient(var(--brand), var(--brand)); color: var(--brand-ink); }
.btn-filters[aria-expanded="true"] { background: var(--surface-3); }
.btn-filters .count { background: var(--brand); color: var(--brand-ink); border-radius: 999px; font-size: 11px; padding: 0 6px; font-weight: 700; }

/* ========================================================================
   List table
   ======================================================================== */
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow-x: auto; overflow-y: hidden; }
table.tasks { width: 100%; border-collapse: collapse; table-layout: auto; }
table.tasks th {
  text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 0; height: 38px; background: var(--surface);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.tasks th .th-btn { display: inline-flex; align-items: center; gap: 4px; height: 38px; width: 100%; padding: 0 10px; background: none; border: 0; color: inherit; font-weight: 600; }
table.tasks th .th-btn:hover { color: var(--ink); }
table.tasks th .sort-arrow { font-size: 10px; opacity: .8; }
table.tasks td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
table.tasks tbody tr.task-row { cursor: pointer; }
table.tasks tbody tr.task-row:hover td { background: var(--surface-2); }
table.tasks tbody tr.task-row.is-selected td { background: var(--brand-soft); }
table.tasks tbody tr.task-row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
table.tasks tbody tr:last-child td { border-bottom: 0; }
.td-id { width: 72px; color: var(--muted); white-space: nowrap; }
.td-name { min-width: 170px; overflow-wrap: anywhere; word-break: break-word; }
.td-name .nm, .td-name .sub { overflow-wrap: anywhere; }
table.tasks td:not(.td-name):not(.td-deadline) { white-space: nowrap; }
.td-name .nm { font-weight: 600; color: var(--ink); line-height: 1.35; }
.td-name .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.td-person { white-space: nowrap; }
.person { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.td-deadline { min-width: 118px; }
.td-deadline .badge { white-space: normal; height: auto; min-height: 22px; padding: 2px 7px; flex-wrap: wrap; line-height: 1.3; }
.td-deadline .dl-date { font-variant-numeric: tabular-nums; margin-bottom: 3px; font-size: 13px; }
.td-rev { text-align: center; font-variant-numeric: tabular-nums; }
.rev-hot { color: var(--dl-overdue-fg); font-weight: 700; }
.row-flags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.group-head td { background: var(--surface-2); padding: 0; }
.group-head button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px; background: none; border: 0; font-weight: 600; text-align: left; }
.group-head .chev { transition: transform .15s; }
.group-head[aria-expanded="false"] .chev, .group-head button[aria-expanded="false"] .chev { transform: rotate(-90deg); }
@media (max-width: 1439px) { table.tasks .col-hide-lg { display: none; } }

/* list mobile cards */
.card-list { display: flex; flex-direction: column; gap: 8px; }
.group-title { display: flex; align-items: center; gap: 8px; padding: 10px 2px 2px; font-weight: 600; background: none; border: 0; width: 100%; text-align: left; }
.mcard {
  position: relative; display: block; width: 100%; min-width: 0; text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--shadow-1); cursor: pointer;
}
.mcard.is-overdue { border-color: color-mix(in srgb, var(--dl-overdue) 45%, var(--line)); }
.mcard.is-selected { border-color: var(--brand); }
.mcard-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: var(--muted); }
.mcard-top .avatar { margin-left: auto; }
.mcard-name { font-weight: 600; margin-bottom: 8px; line-height: 1.35; overflow-wrap: anywhere; word-break: break-word; }
.mcard-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ========================================================================
   Kanban
   ======================================================================== */
.board {
  display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; align-items: stretch;
  min-height: calc(100vh - var(--topbar-h) - 200px);
}
@media (min-width: 1100px) {
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; overflow-x: visible; }
  .board .col { width: auto; flex: none; }
  .board .col[data-collapsed="true"] { min-width: 0; }
}
body.is-dragging .board { scroll-snap-type: none !important; }
.col {
  flex: 0 0 272px; width: 272px; min-width: 0; display: flex; flex-direction: column; background: var(--surface-3);
  border-radius: var(--r-lg); min-height: 320px; position: relative; scroll-snap-align: start; transition: opacity .15s, box-shadow .15s, background .15s;
  background: color-mix(in srgb, var(--surface-3) 70%, var(--canvas));
}
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; }
.col-head::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--st-dot); flex: none; }
.col[data-collapsed="true"] .col-head::before { display: none; }
.col-title { font-weight: 600; font-size: 13px; }
.col-count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; font-size: 12px; }
.col-toggle { margin-left: auto; }
.col-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 2px 8px 12px; min-height: 60px; min-width: 0; }
.col-empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 13px; }
.col-more { text-align: center; font-size: 12.5px; color: var(--muted); padding: 6px; }
.col[data-collapsed="true"] { flex: 0 0 46px; min-width: 46px; cursor: pointer; }
.col[data-collapsed="true"] .col-head { flex-direction: column; padding: 14px 0; gap: 10px; height: 100%; }
.col[data-collapsed="true"] .col-title { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
.col[data-collapsed="true"] .col-body, .col[data-collapsed="true"] .col-toggle-x { display: none; }
.col[data-drop="disabled"] { opacity: .4; }
.col[data-drop="allowed"] { box-shadow: inset 0 0 0 2px var(--brand); }
.col[data-drop="allowed"].is-over { background: var(--brand-soft); }
.kcard {
  position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 10px 11px; box-shadow: var(--shadow-1); cursor: grab; touch-action: pan-x pan-y; user-select: none; transition: border-color .12s, box-shadow .12s;
}

.kcard:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.kcard-top { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; flex-wrap: wrap; padding-right: 22px; }
.kcard-top .mono { color: var(--muted); }
.kcard-name { overflow-wrap: anywhere; word-break: break-word; padding-right: 22px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
.kcard-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }

.kcard .badge { white-space: normal; height: auto; min-height: 20px; padding: 2px 7px; line-height: 1.3; flex-wrap: wrap; max-width: 100%; }
.kcard .badge[data-state="ok"], .kcard .badge[data-state="none"] { padding: 0; }
.kcard-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.kcard-foot .progress { flex: 1; }
.kcard-menu-btn { position: absolute; right: 4px; top: 4px; }
.kcard.is-ghost { position: fixed; z-index: 90; pointer-events: none; box-shadow: var(--shadow-3); transform: rotate(1.5deg); opacity: .96; width: 256px; cursor: grabbing; }
.kcard.is-dragging { opacity: .35; }
.kcard.is-held { background: var(--surface-2); }
.kpos { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--brand-text); }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; }

/* ========================================================================
   Menus / popovers
   ======================================================================== */
.menu {
  position: fixed; z-index: 80; min-width: 210px; max-width: 290px; padding: 5px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-2); animation: pop .12s ease-out;
}
.menu-item {
  display: flex; align-items: center; gap: 9px; width: 100%; min-height: 34px; padding: 6px 10px; border-radius: 6px;
  border: 0; background: none; text-align: left; font-size: 13.5px;
}
.menu-item .ico { color: var(--muted); width: 16px; height: 16px; }
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-3); outline: none; }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu-label { padding: 6px 10px 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.menu .pill { pointer-events: none; }

/* ========================================================================
   Overlays: drawer, modal
   ======================================================================== */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 50; animation: fade .16s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide-in { from { transform: translateX(24px); opacity: .5; } }
@keyframes pop { from { transform: translateY(6px) scale(.99); opacity: 0; } }
/* Chi tiết đơn: cửa sổ lớn giữa màn hình (desktop), toàn màn hình (mobile) */
.drawer {
  position: fixed; inset: 0; margin: auto; width: min(1120px, calc(100vw - 48px)); height: min(860px, calc(100vh - 48px)); z-index: 51;
  background: var(--surface); box-shadow: var(--shadow-3); display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r-lg); animation: pop .18s cubic-bezier(.2, .8, .2, 1);
}
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.detail-side { position: sticky; top: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 16px 4px; }
.detail-side .fieldset { margin-bottom: 12px; }
.form-grid.is-side { grid-template-columns: 1fr; gap: 12px; }
.form-grid.is-side > .field { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; column-gap: 10px; }
.form-grid.is-side > .field > label, .form-grid.is-side > .field > .label { margin: 0; color: var(--muted); font-weight: 500; }
.form-grid.is-side > .field > :not(label):not(.label) { grid-column: 2; }
.detail-main .field textarea:not([data-k="description"]) { min-height: 40px; }
@media (max-width: 899px) { .detail-grid { grid-template-columns: 1fr; } .detail-side { position: static; order: -1; } }
.drawer-head { padding: 14px 18px 12px 22px; border-bottom: 1px solid var(--line); }
.drawer-topline { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.drawer-id { font-family: var(--mono); font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.drawer-id:hover { color: var(--ink); border-color: var(--line-strong); }
.drawer-topline .spacer { flex: 1; }
.drawer-name {
  width: 100%; font-size: 19px; font-weight: 650; letter-spacing: -0.015em; border: 1px solid transparent; border-radius: 8px;
  padding: 4px 8px; margin-left: -8px; background: transparent; line-height: 1.3;
}
.drawer-name:hover { border-color: var(--line); }
.drawer-name:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
.drawer-name.is-ro { border: 0; padding: 4px 0; margin: 0; }
.drawer-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.drawer-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.act-sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 2px; }
.act-note { font-size: 12.5px; }
.tabs { display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.tab { height: 42px; padding: 0 10px; border: 0; background: none; color: var(--muted); font-weight: 600; position: relative; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--brand); border-radius: 2px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px 28px; }
.drawer-banner { margin: 12px 22px 0; padding: 10px 12px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); display: flex; gap: 10px; align-items: center; justify-content: space-between; font-weight: 500; }
.drawer-banner.is-danger { background: var(--err-bg); color: var(--err-fg); border-color: var(--err-line); }
.info-box { display: flex; gap: 8px; align-items: flex-start; margin: 12px 22px 0; padding: 10px 12px; border-radius: var(--r-md); background: var(--st-review-bg); color: var(--st-review-fg); font-size: 13px; }
.info-box .ico { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.info-box.is-hold { background: var(--surface-2); color: var(--ink-2); border: 1px dashed var(--line-strong); }
.info-box.is-discuss { background: var(--dl-overdue-bg); color: var(--dl-overdue-fg); }
.savebar {
  display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-top: 1px solid var(--line);
  background: var(--surface); box-shadow: 0 -6px 18px rgba(0,0,0,.05);
}
.savebar .msg { flex: 1; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.savebar .msg::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.ai-card { border: 1px solid var(--line); border-radius: var(--r-md); margin-bottom: 20px; overflow: hidden; }
.ai-card-head { display: flex; align-items: center; gap: 7px; padding: 8px 12px; background: var(--brand-soft); font-weight: 650; font-size: 12.5px; color: var(--brand-text); }
.ai-card-head .ico { color: var(--brand); width: 15px; height: 15px; }
.ai-card-body { padding: 10px 12px; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; overflow-wrap: anywhere; }
.child-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r-md); }
.child-list li + li { border-top: 1px solid var(--line); }
.child-link { display: flex; align-items: center; gap: 8px; padding: 8px 10px; text-decoration: none; min-width: 0; }
.child-link:hover { background: var(--surface-2); }
.child-link .mono { color: var(--muted); flex: none; }
.child-link .cname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

/* forms */
.fieldset { border: 0; padding: 0; margin: 0 0 24px; min-width: 0; }
.fieldset legend { font-size: 12.5px; font-weight: 650; color: var(--muted); padding: 0; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; width: 100%; }
