.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.field label, .field .label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.field .req { color: var(--dl-overdue-fg); }
.input, .field input[type="text"], .field input[type="number"], .field input[type="date"], .field input[type="url"], .field input[type="password"], .field input[type="email"], .field select, .field textarea {
  width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.field textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
.field textarea[data-k="briefLink"], .field textarea[data-k="deliveryLink"] { min-height: 36px; }
.field input:hover, .field select:hover, .field textarea:hover, .input:hover { border-color: var(--faint); }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
.field input:disabled, .field select:disabled, .field textarea:disabled, .drawer-name:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; border-color: var(--line); }
.drawer-name:disabled { border-color: transparent; }
.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--dl-overdue); }
.field-error { color: var(--err-fg); font-size: 12.5px; margin-top: 5px; font-weight: 500; }
.field-hint { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
.field-hint.is-info { color: var(--brand-text); font-weight: 500; }
.field-hint.is-warn { color: var(--warn-fg); font-weight: 500; }
.field.ro .ro-val { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 36px; padding: 4px 0; overflow-wrap: anywhere; }
.field.ro .ro-val > .btn { margin-left: auto; }
.ro-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.ro-sub { width: 100%; font-size: 12px; color: var(--muted); }
.ro-line { margin-bottom: 8px; }
.ro-line a { color: var(--brand-text); font-weight: 600; }
.notes-ro { white-space: pre-wrap; background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; font-size: 13px; width: 100%; }
.input-sm { min-height: 32px !important; padding: 5px 9px !important; }
.progress-edit { display: flex; align-items: center; gap: 10px; }
.progress-edit input[type="range"] { flex: 1; accent-color: var(--brand); }
.progress-edit input[type="number"] { width: 80px; flex: none; }
.links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.link-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 28px; padding: 0 10px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface); color: var(--brand-text); text-decoration: none; font-size: 12.5px; font-weight: 500;
}
.link-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
.link-chip:hover { border-color: var(--brand); }
.danger-zone { margin-top: 8px; padding-top: 16px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }

/* activity */
.comment-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.comment-box textarea { width: 100%; min-height: 72px; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); resize: vertical; }
.comment-box textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
.comment-box .row { display: flex; justify-content: flex-end; }
.activity-list { list-style: none; margin: 0; padding: 0; position: relative; }
.activity-item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 8px 0 12px; position: relative; }
.activity-item:not(:last-child)::before { content: ""; position: absolute; left: 14px; top: 40px; bottom: -4px; width: 1px; background: var(--line); }
.act-head { font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
.activity-item > div { min-width: 0; }
.act-head b { font-weight: 600; }
.act-time { color: var(--muted); font-size: 12px; margin-top: 1px; }
.act-quote { margin-top: 6px; padding: 8px 11px; background: var(--surface-2); border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
.act-comment { margin-top: 6px; padding: 9px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; white-space: pre-wrap; word-break: break-word; }
.act-comment a, .act-quote a { color: var(--brand-text); }

/* modal */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; overflow-y: auto; }
.modal-wrap.top { z-index: 70; }
.modal {
  position: relative; width: min(640px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3); animation: pop .16s ease-out; border: 1px solid var(--line);
}
.modal-sm { width: min(460px, 100%); }
.modal-lg { width: min(780px, 100%); }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 6px; }
.modal-title { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; flex: 1; }
.modal-desc { color: var(--muted); padding: 0 20px; overflow-wrap: anywhere; }
.modal-body { padding: 14px 20px 6px; overflow-y: auto; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; display: flex; align-items: center; gap: 8px; }
.modal.is-danger .modal-title { color: var(--err-fg); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--brand); }
.seg { display: inline-flex; border-radius: 10px; padding: 3px; gap: 2px; background: var(--surface-3); flex-wrap: wrap; }
.seg label { position: relative; margin: 0 !important; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); font-weight: 600; }
.seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 1px; }
.quick-dates { display: flex; gap: 6px; flex-wrap: wrap; }
.date-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.date-row input[type="date"] { width: 200px; flex: none; }
.advanced-toggle { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-2); font-weight: 600; padding: 6px 0; }
.advanced-toggle .chev { transition: transform .15s; }
.advanced-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.conflict-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.conflict-table th { text-align: left; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.conflict-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
.conflict-table td.theirs { background: var(--warn-bg); }
.conflict-table td.mine { background: var(--brand-soft); }
.kbd-table { width: 100%; border-collapse: collapse; }
.kbd-table td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.kbd-table td:first-child { white-space: nowrap; width: 40%; }
kbd { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); color: var(--ink-2); }

/* date input */
.date-input { position: relative; display: flex; align-items: center; width: 100%; max-width: 220px; }
.date-input .date-text { padding-right: 40px !important; font-variant-numeric: tabular-nums; width: 100%; min-height: 36px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); padding: 7px 10px; }
.date-input .date-text:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
.date-input .date-text[aria-invalid="true"] { border-color: var(--dl-overdue); }
.date-input .date-pick { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); }
.date-input .date-native { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
.date-input.is-disabled .date-text { background: var(--surface-2); color: var(--muted); }

/* split dialog */
.split-head, .split-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 76px 170px 36px; gap: 8px; align-items: start; }
.split-head { font-size: 12px; color: var(--muted); font-weight: 600; }
.split-row { margin-bottom: 8px; }
.split-row .field { margin: 0; }
.split-row .field select, .split-row .field input[type="text"] { min-height: 36px; }
.split-no { display: grid; place-items: center; height: 36px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.split-dl .date-input { max-width: none; }
.split-row .icon-btn { margin-top: 2px; }
.split-sug { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.8; }

/* ========================================================================
   Settings
   ======================================================================== */
.settings { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 28px; align-items: start; }
.settings-tabs { display: flex; flex-direction: column; gap: 1px; position: sticky; top: calc(var(--topbar-h) + 28px); }
.settings-tab { text-align: left; height: 34px; padding: 0 10px; border-radius: var(--r-md); border: 0; background: none; font-weight: 500; color: var(--ink-2); text-decoration: none; display: flex; align-items: center; }
.settings-tab:hover { background: var(--surface-3); }
.settings-tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.settings-section { display: flex; flex-direction: column; gap: 16px; max-width: 820px; }
.settings-solo { max-width: 640px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow-1); }
.card h2 { font-size: 15px; margin-bottom: 4px; }
.card .card-desc { color: var(--muted); margin-bottom: 14px; }
.card code, details.guide code { font-family: var(--mono); font-size: 12px; background: var(--surface-3); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.inline-form { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.inline-form .field { flex: 1 1 220px; }
.result-line { margin-top: 10px; font-weight: 500; }
.result-line.ok { color: var(--ok-fg); }
.result-line.err { color: var(--err-fg); }
.catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.cat-list { list-style: none; margin: 0 0 12px; padding: 0; border: 1px solid var(--line); border-radius: var(--r-md); max-height: 330px; overflow-y: auto; }
.cat-item { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--line); min-height: 40px; }
.cat-item:last-child { border-bottom: 0; }
.cat-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-item .nm input { width: 100%; height: 30px; padding: 0 8px; border: 1px solid var(--brand); border-radius: 6px; background: var(--surface); }
.cat-item .use { font-size: 12px; color: var(--muted); white-space: nowrap; }
.cat-add { display: flex; gap: 8px; }
.cat-add input { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); }
.cat-add input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
.status-ro { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.size-row { display: inline-flex; align-items: center; gap: 8px; margin-right: 14px; font-size: 13px; }
table.members { width: 100%; border-collapse: collapse; }
table.members th { text-align: left; font-size: 12px; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); font-weight: 600; }
table.members td { padding: 8px; border-bottom: 1px solid var(--line); }
table.members td.c, table.members th.c { text-align: center; }
table.members input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--brand); }
.td-email { min-width: 220px; }
.td-email .field { margin: 0; }
.td-email .field-error, .td-email .field-hint { margin-top: 3px; }
.member-add { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.member-add input[type="text"], .member-add input[type="email"], .member-add select { height: 34px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0 10px; background: var(--surface); }
.member-add input[type="text"] { flex: 1 1 180px; }
.member-add input[type="email"] { flex: 1 1 200px; }
.warn-box { padding: 10px 12px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.warn-box ul { margin: 6px 0 0; padding-left: 18px; }
.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 12px; margin-bottom: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
details.guide { margin: 4px 0 2px; }
details.guide summary { cursor: pointer; font-weight: 600; list-style: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); padding: 4px 0; }
details.guide summary::-webkit-details-marker { display: none; }
details.guide summary .chev { transition: transform .15s; width: 16px; height: 16px; }
details.guide[open] summary .chev { transform: rotate(90deg); }
details.guide ol { margin: 8px 0 0; padding-left: 22px; line-height: 1.8; color: var(--ink-2); }
.profile { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.profile > div { flex: 1; min-width: 180px; }
.profile-name { font-weight: 650; font-size: 15px; overflow-wrap: anywhere; }
.profile-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.ai-status { display: flex; align-items: center; gap: 8px; font-weight: 500; margin-bottom: 6px; }
.ai-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.ai-status[data-enabled="true"] .dot { background: var(--st-done); box-shadow: 0 0 0 3px var(--st-done-bg); }
.ai-status[data-enabled="false"] .dot { background: var(--dl-dueSoon); }
.callout { padding: 11px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); margin-bottom: 16px; }
.callout a { color: var(--brand-text); font-weight: 600; }
.callout.is-error { background: var(--err-bg); color: var(--err-fg); border-color: var(--err-line); }
.callout.is-ok { background: var(--ok-bg); color: var(--ok-fg); border-color: transparent; }

/* ========================================================================
   States: empty, loading
   ======================================================================== */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 20px; color: var(--muted); }
.qsection .empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); }
.empty svg { width: 110px; height: 82px; color: var(--line-strong); }
.empty .empty-title { color: var(--ink); font-weight: 600; font-size: 15px; }
.empty.is-error .empty-title { color: var(--err-fg); }
.skeleton-row { display: grid; grid-template-columns: 60px 1fr 120px 100px 110px; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.skel { display: inline-block; height: 12px; width: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--surface-3) 0%, var(--surface-2) 50%, var(--surface-3) 100%); background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ========================================================================
   Toasts
   ======================================================================== */
.toast-root { position: fixed; right: 20px; bottom: 20px; z-index: 95; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 10px; min-width: 260px; max-width: 440px; padding: 10px 10px 10px 14px;
  background: #1a1e27; color: #f2f4f7; border-radius: var(--r-md); box-shadow: var(--shadow-2); animation: pop .16s ease-out; font-weight: 500;
}
.toast .msg { flex: 1; line-height: 1.4; }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; background: #4ade80; }
.toast[data-type="error"] { background: #9b1c22; color: #fff; }
.toast[data-type="error"]::before { background: #fecaca; }
.toast[data-type="info"]::before { background: #93b4fd; }
.toast button { border: 0; background: rgba(255,255,255,.14); color: inherit; height: 28px; padding: 0 10px; border-radius: 6px; font-weight: 600; font-size: 13px; }
.toast button:hover { background: rgba(255,255,255,.26); }
.toast .toast-x { background: none; width: 28px; padding: 0; }

/* ========================================================================
   Requester: Đơn của tôi
   ======================================================================== */
.osec { margin-bottom: 30px; }
.osec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 2px 10px; }
.osec-head h2 { font-size: 14px; display: flex; align-items: center; font-weight: 650; }
.osec-head p { color: var(--muted); font-size: 13px; }
.osec.is-hot .osec-head h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--st-review); margin-right: 8px; }
.ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ocard {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px;
  box-shadow: var(--shadow-1); cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow-wrap: anywhere; transition: border-color .12s, box-shadow .12s;
}
.ocard:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
.ocard:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.osec.is-hot .ocard { border-color: color-mix(in srgb, var(--st-review) 55%, var(--line)); }
.oc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.oc-top .mono { color: var(--muted); }
.oc-spacer { flex: 1; }
.oc-name { font-weight: 600; font-size: 15px; line-height: 1.35; }
.oc-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.oc-queue { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--surface-2); border-radius: var(--r-md); font-size: 13px; }
.oc-pos b { font-size: 15px; color: var(--ink); }
.oc-reasons { color: var(--muted); font-size: 12px; }
.oc-auto { font-size: 12.5px; color: var(--st-review-fg); background: var(--st-review-bg); border-radius: 6px; padding: 4px 8px; align-self: flex-start; }
.oc-actions { display: flex; gap: 8px; margin-top: 2px; }
.oc-actions .btn { flex: 1; }

/* ========================================================================
   Tạo đơn
   ======================================================================== */
.order-wrap { display: grid; grid-template-columns: minmax(0, 760px) minmax(0, 280px); gap: 24px; align-items: start; }
.order-wrap > .order-card:only-child { grid-column: 1 / 2; }
.order-card { padding: 22px 24px; }
.order-card .form-grid { margin-top: 14px; }
.order-q { font-size: 16px !important; font-weight: 650 !important; color: var(--ink) !important; margin-bottom: 8px !important; }
.order-card textarea#or-message { min-height: 140px; font-size: 15px; line-height: 1.55; }
.order-count { display: flex; justify-content: space-between; gap: 12px; }
.order-count [data-count] { font-variant-numeric: tabular-nums; white-space: nowrap; }
.urgent-box { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); }
.urgent-box.is-on { border-color: color-mix(in srgb, var(--dl-overdue) 50%, var(--line)); background: var(--dl-overdue-bg); }
.urgent-box .check span b { color: var(--ink); }
.urgent-reason { margin-top: 8px; }
.urgent-reason input { width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); }
.order-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.order-actions.center { justify-content: center; }
.order-actions .btn-brand .ico { width: 16px; height: 16px; }
.order-tips { background: transparent; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; color: var(--ink-2); font-size: 13px; }
.order-tips h2 { font-size: 13.5px; margin-bottom: 8px; }
.order-tips ul { margin: 0; padding-left: 18px; line-height: 1.7; }
.order-progress { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; counter-reset: st; }
.order-progress li { counter-increment: st; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 4px 10px 4px 4px; border-radius: 999px; }
.order-progress li::before { content: counter(st); display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--ink-2); font-size: 11px; }
.order-progress li.is-current { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.order-progress li.is-current::before { background: var(--brand); color: var(--brand-ink); }
.order-progress li.is-done::before { content: "✓"; background: var(--st-done-bg); color: var(--st-done-fg); }
.thread { display: flex; flex-direction: column; gap: 12px; }
.bubble { display: flex; gap: 10px; max-width: 92%; }
.bubble.is-user { align-self: flex-end; }
.bubble.is-user .bubble-body { background: var(--brand); color: var(--brand-ink); border-radius: 14px 14px 4px 14px; }
.bubble.is-ai .bubble-body { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; flex: 1; min-width: 0; }
.bubble-body { padding: 10px 14px; line-height: 1.5; overflow-wrap: anywhere; }
.bubble-ava, .msg-ava { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.bubble-ava .ico, .msg-ava .ico { width: 15px; height: 15px; }
.ai-round { font-size: 12px; font-weight: 650; color: var(--muted); margin-bottom: 10px; }
.ai-qs { margin: 0; padding-left: 18px; }
.bubble.is-ai .field label { font-weight: 600; color: var(--ink); font-size: 13.5px; }
.thread-fold { margin-bottom: 14px; }
.thread-fold summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; list-style: none; }
.thread-fold summary::-webkit-details-marker { display: none; }
.thread-fold[open] summary .chev { transform: rotate(90deg); }
.thread-fold .thread { margin-top: 10px; }
.assess { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.assess-item { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.assess-item.span-2 { grid-column: 1 / -1; }
.assess-l { font-size: 12.5px; font-weight: 650; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.assess-l .ico { width: 14px; height: 14px; color: var(--brand); }
.assess-v { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.assess-why { font-size: 12.5px; color: var(--ink-2); }
.assess-sum { font-size: 13.5px; line-height: 1.5; }
.assess .field select { min-height: 34px; }
.miss-tag { margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--warn-fg); background: var(--warn-bg); border-radius: 4px; padding: 1px 6px; }
.ai-note { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: var(--r-md); background: var(--brand-soft); color: var(--ink-2); font-size: 13px; }
.ai-note .ico { color: var(--brand); flex: none; margin-top: 1px; }
.ai-note.is-warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.ai-note.is-off { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line-strong); }
.wizard-steps { display: flex; gap: 6px; list-style: none; margin: 0 0 6px; padding: 0; flex-wrap: wrap; }
.wizard-steps li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 600; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid var(--line); }
.wizard-steps li span { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); font-size: 11.5px; }
.wizard-steps li.is-current { color: var(--ink); border-color: var(--brand); }
.wizard-steps li.is-current span { background: var(--brand); color: var(--brand-ink); }
.wizard-steps li.is-done span { background: var(--st-done-bg); color: var(--st-done-fg); }
.order-done { text-align: center; padding: 36px 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.order-done h2 { font-size: 20px; }
.done-mark { width: 52px; height: 52px; border-radius: 50%; background: var(--st-done-bg); color: var(--st-done-fg); display: grid; place-items: center; margin-bottom: 4px; }
.done-mark .ico { width: 28px; height: 28px; stroke-width: 2.4; }
.done-pos { font-size: 15px; }
.done-pos b { font-size: 20px; color: var(--brand-text); }

/* ========================================================================
   Trợ lý AI
   ======================================================================== */
.seg-tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-3); border-radius: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.seg-tab { height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); font-weight: 550; }
.seg-tab:hover { color: var(--ink); }
.seg-tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: var(--shadow-1); }
.ai-pane { display: flex; flex-direction: column; gap: 18px; max-width: 960px; }
.ai-intro { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.ai-intro p { flex: 1 1 360px; color: var(--ink-2); max-width: 70ch; }
.ai-intro-actions { display: flex; gap: 8px; }
.ai-result { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 10px; line-height: 1.6; }
.ai-result h3, .msg-body h3, .ai-risks h3 { font-size: 13.5px; font-weight: 650; margin-top: 6px; }
.ai-result ul, .msg-body ul { margin: 0; padding-left: 20px; }
.ai-result li + li, .msg-body li + li { margin-top: 2px; }
.ai-result .sec-head { margin: 10px 0 0; }
.ai-report { max-width: 76ch; }
.ai-risks { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.ai-risks ul { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
.ai-risks li { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; }
.risk-lv { flex: none; font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); }
.ai-risks li[data-level="high"] .risk-lv { background: var(--dl-overdue-bg); color: var(--dl-overdue-fg); }
.ai-risks li[data-level="medium"] .risk-lv { background: var(--dl-dueSoon-bg); color: var(--dl-dueSoon-fg); }
.ai-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.ai-apply { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
table.plan-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.plan-table th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.plan-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plan-table tr:last-child td { border-bottom: 0; }
table.plan-table td.c, table.plan-table th.c { width: 36px; text-align: center; }
table.plan-table td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.plan-table td.num.is-late { color: var(--dl-overdue-fg); font-weight: 600; }
table.plan-table td.reason { color: var(--muted); min-width: 180px; }
table.plan-table .nm { font-weight: 550; }
table.plan-table input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--brand); }
.late-tag { font-size: 11px; font-weight: 650; }
.ai-thread { display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; max-width: 88%; }
.msg.is-user { align-self: flex-end; background: var(--brand); color: var(--brand-ink); padding: 9px 14px; border-radius: 14px 14px 4px 14px; }
.msg.is-ai .msg-body { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 12px 16px; flex: 1; min-width: 0; line-height: 1.6; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 6px; }
.ai-suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ai-suggest p { width: 100%; }
.ai-ask { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: 16px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 8px; box-shadow: var(--shadow-2); }
.ai-ask textarea { flex: 1; border: 0; resize: none; padding: 6px 8px; background: transparent; min-height: 40px; max-height: 160px; line-height: 1.5; }
.ai-ask textarea:focus { outline: none; }
.ai-ask:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft), var(--shadow-2); }

/* ========================================================================
   Login
   ======================================================================== */
body[data-role="requester"] [data-testid="btn-new-request"] { display: none; }
body.is-login .app { display: none; }
.login { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--canvas); }
.login-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-2); padding: 28px 28px 20px; display: flex; flex-direction: column; gap: 14px; }
.lg-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.lg-brand .brand-mark { width: 34px; height: 34px; }
.lg-brand .brand-name { font-size: 17px; }
.login-card h1 { font-size: 21px; letter-spacing: -0.02em; }
.lg-sub { margin-top: -6px; }
.lg-google { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-height: 44px; }
.lg-google #g-btn { display: flex; justify-content: center; min-height: 44px; }
.lg-demo { padding: 10px 12px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); font-size: 13px; }
.lg-demo code { font-family: var(--mono); font-weight: 700; background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 1px 6px; border-radius: 4px; letter-spacing: .1em; }
.lg-info { padding: 9px 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.lg-form { display: flex; flex-direction: column; gap: 12px; }
.lg-form .input { min-height: 44px; font-size: 15px; }
.lg-code { font-family: var(--mono); font-size: 24px !important; letter-spacing: .5em; text-align: center; padding-left: .5em !important; }
.lg-btn { height: 44px; font-size: 15px; }
.lg-links { display: flex; justify-content: space-between; gap: 10px; }
.lg-error { margin: 0; }
.api-url { display: block; font-family: var(--mono); font-size: 12.5px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line-strong); overflow-wrap: anywhere; word-break: break-all; color: var(--ink); }
.api-url.is-cur { display: inline; padding: 1px 5px; border: 0; }
.lg-sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; margin: 2px 0; }
.lg-sep::before, .lg-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.lg-group h3 { font-size: 12px; color: var(--muted); font-weight: 650; margin: 4px 0 6px; }
.lg-accounts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.lg-acc { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 48px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); text-align: left; min-width: 0; transition: border-color .12s, background .12s; }

/* ========================================================================

   ======================================================================== */
.buddy { position: fixed; left: 14px; bottom: 14px; z-index: 45; display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
.buddy > * { pointer-events: auto; }
.buddy-ava { width: 92px; height: 104px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; transform-origin: 50% 100%; filter: drop-shadow(0 6px 10px rgba(80, 30, 15, .22)); transition: transform .2s; }
.buddy-ava img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; }
.buddy-ava:hover { transform: translateY(-3px) rotate(-3deg); }
.buddy-ava:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 12px; }
.buddy[data-open="false"] .buddy-ava { animation: buddy-breathe 3.6s ease-in-out infinite; }
.buddy.is-pop .buddy-ava { animation: buddy-hop .7s cubic-bezier(.3, 1.6, .5, 1) both; }
.buddy-bubble {
  position: relative; width: min(360px, calc(100vw - 130px)); margin-bottom: 38px; padding: 14px 16px 14px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 18px 18px 18px 6px; box-shadow: var(--shadow-3);
  animation: bubble-in .35s cubic-bezier(.2, 1.3, .4, 1) both; transform-origin: 0 100%;
}
.buddy-bubble::before { content: ""; position: absolute; left: -9px; bottom: 14px; width: 16px; height: 16px; background: var(--surface); border-left: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); transform: rotate(45deg); border-radius: 0 0 0 4px; }
.buddy-x { position: absolute; top: 6px; right: 6px; }
.buddy-line { font-size: 14.5px; padding-right: 26px; line-height: 1.4; }
.buddy-sub { margin-top: 6px; color: var(--ink-2); line-height: 1.5; min-height: 1.5em; }
.buddy-answer { margin-top: 8px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); max-height: 240px; overflow-y: auto; }
.buddy-answer ul { margin: 4px 0; padding-left: 18px; }
.buddy-answer p + p { margin-top: 6px; }
.buddy-answer h3 { font-size: 13px; margin-top: 6px; }
.buddy-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.buddy-chip { min-height: 32px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 550; text-align: left; transition: background .15s, border-color .15s, transform .15s; }
.buddy-chip:first-child { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.buddy-chip:hover { border-color: var(--brand); transform: translateY(-1px); }
.buddy-chip:first-child:hover { background: var(--brand-hover); }
.buddy-ask { display: flex; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.buddy-ask input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); }
.buddy-ask input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.qrow.is-spot { animation: spot 2.4s ease-out; }
@keyframes spot { 0%, 40% { box-shadow: inset 0 0 0 2px var(--brand); background: var(--brand-soft); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
@keyframes buddy-hop { 0% { transform: translateY(40px) scale(.7); opacity: 0; } 55% { transform: translateY(-10px) scale(1.04) rotate(-4deg); opacity: 1; } 75% { transform: translateY(0) rotate(3deg); } 100% { transform: none; } }
@keyframes buddy-breathe { 0%, 100% { transform: none; } 50% { transform: translateY(-2px) scaleY(1.015); } }
@keyframes bubble-in { from { transform: scale(.6) translateY(10px); opacity: 0; } }
